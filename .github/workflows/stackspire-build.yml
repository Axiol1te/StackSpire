name: StackSpire builds

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'handoff/**'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.gemini/**'
      - '.codex/**'
  workflow_dispatch:
    inputs:
      arm64_only:
        description: Build only Windows and Linux ARM64 packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stackspire-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.arm64_only &&
              '[{"platform":"windows","runner":"windows-11-arm","arch":"arm64"},{"platform":"linux","runner":"ubuntu-24.04-arm","arch":"arm64"}]' ||
              '[{"platform":"android","runner":"ubuntu-24.04","arch":"arm64"},{"platform":"android","runner":"ubuntu-24.04","arch":"arm"},{"platform":"android","runner":"ubuntu-24.04","arch":"amd64"},{"platform":"windows","runner":"windows-2022","arch":"amd64"},{"platform":"linux","runner":"ubuntu-24.04","arch":"amd64"},{"platform":"windows","runner":"windows-11-arm","arch":"arm64"},{"platform":"linux","runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      GOMAXPROCS: 2
      GOFLAGS: -p=2
    steps:
      - name: Free space on disposable Linux runner
        if: runner.os == 'Linux'
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          if test "$BUILD_PLATFORM" = android; then
            sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"
          else
            sudo rm -rf /usr/local/lib/android
          fi
          df -h .
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: core/go.sum
      - name: Assign increasing CI build number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const number = 2026105000 + Number(process.env.GITHUB_RUN_NUMBER);
            const source = fs.readFileSync('pubspec.yaml', 'utf8');
            if (!/^version: \S+\+\d+$/m.test(source)) throw new Error('Missing app version');
            fs.writeFileSync('pubspec.yaml', source.replace(/^(version: \S+\+)\d+$/m, (_, prefix) => prefix + number));
            fs.writeFileSync('CI-BUILD-INFO.txt', `commit=${context.sha}\nbuild=${number}\nrun=${context.runId}\n`);
      # ARM hosts bootstrap the pinned stable tag; no matching SDK archive is published.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: ${{ matrix.arch == 'arm64' && matrix.platform != 'android' && 'master' || 'stable' }}
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Install native Rust on Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest -Uri 'https://win.rustup.rs/aarch64' -OutFile $installer
          & $installer -y --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - name: Set up native toolchains
        run: |
          rustup update stable --no-self-update
          rustup default stable
          git config --global core.longpaths true
      - name: Restore Android signing from encrypted secrets
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          printf 'keyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> android/local.properties
      - name: Resolve and validate
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/common/tray_test.dart test/common/window_test.dart test/common/window_visibility_test.dart test/common/protocol_test.dart test/common/launch_test.dart --reporter compact
      - name: Build installers
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          if test "$RUNNER_OS" = Windows; then
            export PATH="${PUB_CACHE:-$LOCALAPPDATA/Pub/Cache}/bin:$PATH"
          else
            export PATH="${PUB_CACHE:-$HOME/.pub-cache}/bin:$PATH"
          fi
          df -h .
          if test "$BUILD_PLATFORM" = android; then
            dart setup.dart android --arch "$BUILD_ARCH" --env pre
          else
            dart setup.dart "$BUILD_PLATFORM" --env pre
          fi
      - name: Verify ARM64 application and native binaries
        if: matrix.arch == 'arm64' && matrix.platform != 'android'
        shell: python
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          import os, pathlib, struct
          if os.environ['BUILD_PLATFORM'] == 'windows':
              root = pathlib.Path('build/windows/arm64/runner/Release')
              files = [root / name for name in ['StackSpire.exe', 'flutter_windows.dll', 'FlClashCore.exe', 'FlClashHelperService.exe']]
              for path in files:
                  data = path.read_bytes()
                  pe = struct.unpack_from('<I', data, 0x3c)[0]
                  assert data[pe:pe + 4] == b'PE\0\0', path
                  assert struct.unpack_from('<H', data, pe + 4)[0] == 0xaa64, path
          else:
              root = pathlib.Path('build/linux/arm64/release/bundle')
              files = [root / name for name in ['StackSpire', 'FlClashCore', 'FlClashHelperService', 'lib/libflutter_linux_gtk.so']]
              for path in files:
                  data = path.read_bytes()
                  assert data[:4] == b'\x7fELF' and data[4] == 2 and data[5] == 1, path
                  assert struct.unpack_from('<H', data, 18)[0] == 183, path
          print('Verified native ARM64 architecture for app, Flutter engine, Core and Helper')
      - name: Remove signing material
        if: always() && matrix.platform == 'android'
        run: rm -f android/app/keystore.jks android/local.properties
      - uses: actions/upload-artifact@v4
        with:
          name: StackSpire-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            CI-BUILD-INFO.txt
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
  macos:
    if: ${{ !inputs.arm64_only }}
    uses: ./.github/workflows/stackspire-macos.yml
    with:
      architecture: both

  release:
    name: Publish release
    needs: [packages, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StackSpire-*
          path: artifacts
      - name: Collect release packages
        shell: python
        run: |
          import pathlib, shutil
          root = pathlib.Path('artifacts')
          expected = {
              'StackSpire-android-arm64', 'StackSpire-android-arm',
              'StackSpire-android-amd64', 'StackSpire-windows-amd64',
              'StackSpire-linux-amd64', 'StackSpire-macos-arm64',
              'StackSpire-macos-amd64', 'StackSpire-windows-arm64',
              'StackSpire-linux-arm64',
          }
          assert {p.name for p in root.iterdir() if p.is_dir()} == expected
          output = pathlib.Path('release')
          output.mkdir()
          extensions = {'.apk', '.exe', '.zip', '.deb', '.rpm', '.AppImage', '.dmg'}
          for artifact in sorted(root.iterdir()):
              packages = [p for p in artifact.rglob('*') if p.is_file() and p.suffix in extensions and not (artifact.name.startswith('StackSpire-macos-') and p.suffix == '.zip')]
              assert packages, f'No package in {artifact}'
              for package in packages:
                  destination = output / package.name
                  assert not destination.exists(), f'Duplicate package name: {package.name}'
                  shutil.copyfile(package, destination)
      - name: Create versioned release without generated notes
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const file = await github.rest.repos.getContent({
              ...context.repo, path: 'pubspec.yaml', ref: context.sha,
            });
            const source = Buffer.from(file.data.content, 'base64').toString('utf8');
            const match = source.match(/^version: (\S+)\+\d+$/m);
            if (!match) throw new Error('Missing app version');
            const versionTag = `v${match[1]}`;
            let tag = versionTag;
            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${versionTag}`});
              tag = `${versionTag}+build.${context.runNumber}`;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
              if (!release.draft || release.target_commitish !== context.sha) {
                throw new Error(`Release ${tag} already exists for another publication`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body: '',
                draft: true,
                prerelease: false,
                generate_release_notes: false,
              })).data;
            }
            core.setOutput('tag', tag);
      - name: Upload packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
